<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q版可愛留言板 💛</title>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Noto+Sans+JP:wght@500;700&family=Noto+Sans+SC:wght@500;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    :root {
      --bg-yellow: #fff9db;
      --card-bg: #ffffff;
      --accent-yellow: #ffe066;
      --primary-orange: #ff922b;
      --text-color: #5c4813;
      --border-color: #ffe08a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans TC', 'Noto Sans SC', 'Noto Sans JP', 'Comfortaa', sans-serif;
      background-color: var(--bg-yellow);
      background-image: radial-gradient(#fcc419 1.5px, transparent 1.5px), radial-gradient(#fcc419 1.5px, #fff9db 1.5px);
      background-size: 60px 60px;
      background-position: 0 0, 30px 30px;
      min-height: 100vh;
      color: var(--text-color);
      padding: 20px 15px;
      display: flex;
      justify-content: center;
    }

    .container { width: 100%; max-width: 500px; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .lang-switcher select {
      padding: 6px 10px;
      border-radius: 12px;
      border: 2px solid var(--border-color);
      background: #fff;
      font-weight: bold;
      color: var(--text-color);
      cursor: pointer;
    }

    .refresh-btn {
      background: #fff;
      border: 2px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      color: var(--text-color);
      transition: all 0.2s;
    }
    .refresh-btn:hover { background: var(--accent-yellow); }

    .header-box { text-align: center; margin-bottom: 20px; }
    .chibi-avatar { font-size: 60px; display: inline-block; animation: bounce 2s infinite; }
    .header-box h1 { font-size: 1.8rem; font-weight: 900; color: #e67700; text-shadow: 2px 2px 0px #fff; }
    .header-box p { font-size: 0.95rem; color: #997404; font-weight: 700; }

    .form-card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 25px;
      box-shadow: 0 8px 0px #fcc419, 0 15px 20px rgba(0,0,0,0.05);
      border: 3px solid #ffe066;
      margin-bottom: 25px;
    }

    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.95rem; font-weight: 900; color: #d97706; margin-bottom: 6px; }

    input[type="text"], textarea, select {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--border-color);
      border-radius: 16px;
      font-size: 0.95rem;
      background: #fffbeb;
      color: var(--text-color);
      font-family: inherit;
    }

    .emoji-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .emoji-btn {
      background: #fff3bf;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 1.1rem;
      transition: transform 0.1s;
    }
    .emoji-btn:hover { transform: scale(1.2); }

    .theme-picker { display: flex; gap: 8px; margin-top: 5px; }
    .theme-opt {
      width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
      border: 2px solid transparent; transition: transform 0.2s;
    }
    .theme-opt.active { border-color: #d97706; transform: scale(1.15); }

    button.submit-btn {
      width: 100%;
      background: #f59f00;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 20px;
      font-size: 1.1rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 5px 0px #d97706;
      transition: all 0.1s;
      margin-top: 12px;
    }
    button.submit-btn:hover { background: #ff922b; transform: translateY(-2px); }
    button.submit-btn:disabled { background: #cbd5e1; box-shadow: 0 5px 0px #94a3b8; cursor: not-allowed; transform: none; }

    .search-box { margin-bottom: 15px; }
    .search-box input { background: #ffffff; border-color: #ffd43b; }

    .section-title { font-size: 1.2rem; font-weight: 900; color: #d97706; margin-bottom: 12px; text-align: center; }

    .msg-card {
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 5px 0px rgba(0,0,0,0.08);
      position: relative;
    }
    .theme-yellow { background: #ffffff; border: 2px solid #ffec99; box-shadow: 0 5px 0px #ffe066; }
    .theme-pink { background: #fff5f5; border: 2px solid #fcc2d7; box-shadow: 0 5px 0px #faa2c1; }
    .theme-blue { background: #f0f8ff; border: 2px solid #a5d8ff; box-shadow: 0 5px 0px #74c0fc; }
    .theme-purple { background: #f8f0fc; border: 2px solid #eebefa; box-shadow: 0 5px 0px #da77f2; }

    .msg-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .msg-author { font-weight: 900; color: #e67700; font-size: 1rem; }
    .msg-time { font-size: 0.75rem; color: #b45309; background: rgba(255,255,255,0.8); padding: 3px 8px; border-radius: 10px; font-weight: 700; }
    
    .msg-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 8px;
      background: #ffe066;
      color: #d97706;
      margin-bottom: 6px;
    }

    .msg-content { color: #614802; font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    
    .msg-footer { display: flex; justify-content: flex-end; margin-top: 10px; }
    .like-btn {
      background: #ffffff;
      border: 1px solid #ffd43b;
      border-radius: 12px;
      padding: 3px 10px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: bold;
      color: #e67700;
      transition: transform 0.1s;
    }
    .like-btn:active { transform: scale(1.2); }

    .status-msg { text-align: center; color: #b45309; padding: 20px; font-weight: 700; }

    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-bar">
      <div class="lang-switcher">
        <select id="langSelect" onchange="changeLanguage(this.value)">
          <option value="vi">Tiếng Việt</option>
          <option value="zh-TW">繁體中文</option>
          <option value="zh-CN">简体中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
        </select>
      </div>
      <button class="refresh-btn" onclick="loadMessages()">🔄 <span id="ui-refresh">Làm mới</span></button>
    </div>

    <div class="header-box">
      <div class="chibi-avatar">🐥✨</div>
      <h1 id="ui-title">Lưu Bút Chibi</h1>
      <p id="ui-subtitle">Gửi lại lời nhắn ngọt ngào cho tớ nhé!</p>
    </div>

    <div class="form-card">
      <form id="msgForm">
        <div class="form-group">
          <label for="name" id="ui-label-name">🐱 Tên của bạn:</label>
          <input type="text" id="name" required placeholder="Nhập biệt danh cute...">
        </div>
        
        <div class="form-group">
          <label id="ui-label-tag">🏷️ Loại lời nhắn:</label>
          <select id="tag">
            <option value="🎉 Chúc mừng" id="opt-tag-1">🎉 Chúc mừng</option>
            <option value="☕ Tâm sự" id="opt-tag-2">☕ Tâm sự</option>
            <option value="💌 Tỏ tình" id="opt-tag-3">💌 Tỏ tình</option>
            <option value="👭 Bạn bè" id="opt-tag-4">👭 Bạn bè</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message" id="ui-label-msg">💌 Lời nhắn gửi:</label>
          <div class="emoji-bar">
            <span class="emoji-btn" onclick="addEmoji('❤️')">❤️</span>
            <span class="emoji-btn" onclick="addEmoji('✨')">✨</span>
            <span class="emoji-btn" onclick="addEmoji('🌸')">🌸</span>
            <span class="emoji-btn" onclick="addEmoji('🐱')">🐱</span>
            <span class="emoji-btn" onclick="addEmoji('🧸')">🧸</span>
            <span class="emoji-btn" onclick="addEmoji('🎉')">🎉</span>
          </div>
          <textarea id="message" rows="3" required placeholder="Viết gì đó dễ thương..."></textarea>
        </div>

        <div class="form-group">
          <label id="ui-label-theme">🎨 Màu thiệp:</label>
          <div class="theme-picker">
            <div class="theme-opt active" style="background:#ffe066" onclick="selectTheme('theme-yellow', this)"></div>
            <div class="theme-opt" style="background:#faa2c1" onclick="selectTheme('theme-pink', this)"></div>
            <div class="theme-opt" style="background:#74c0fc" onclick="selectTheme('theme-blue', this)"></div>
            <div class="theme-opt" style="background:#da77f2" onclick="selectTheme('theme-purple', this)"></div>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">Gửi Đi Ngay 🚀</button>
      </form>
    </div>

    <div class="section-title" id="ui-section-title">✨ Danh Sách Lời Nhắn ✨</div>
    
    <div class="search-box">
      <input type="text" id="searchInput" oninput="filterMessages()" placeholder="🔍 Tìm kiếm lời nhắn...">
    </div>

    <div id="list"><div class="status-msg" id="ui-loading">Đang tải tin nhắn... 🐾</div></div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzLcKAOEPWXfpnUt_3igLdqISkb0hCNgnI7hyXXVNLxqUoSmW90L2dlgS4jgohQ0yw_QQ/exec";
    const avatars = ["🐱", "🐶", "🐰", "🦊", "🐻", "🐼", "🐨", "🐥"];
    let selectedTheme = 'theme-yellow';
    let allMessages = [];
    let likesData = {};

    // Sửa đầy đủ ngôn ngữ cho Tiếng Trung Giản Thể & Tiếng Nhật
    const i18n = {
      'vi': {
        title: 'Lưu Bút Chibi Cute', subtitle: 'Gửi lại lời nhắn ngọt ngào cho tớ nhé!',
        labelName: '🐱 Tên của bạn:', placeholderName: 'Nhập biệt danh cute...',
        labelMsg: '💌 Lời nhắn gửi:', placeholderMsg: 'Viết gì đó dễ thương...',
        submitBtn: 'Gửi Đi Ngay 🚀', submitting: '⏳ Đang Gửi Tin...',
        sectionTitle: '✨ Danh Sách Lời Nhắn ✨', loading: 'Đang tải tin nhắn... 🐾',
        empty: 'Chưa có lời nhắn nào cả! 🐣', error: '❌ Lỗi tải dữ liệu!', refresh: 'Làm mới',
        search: '🔍 Tìm kiếm lời nhắn...', labelTag: '🏷️ Loại lời nhắn:', labelTheme: '🎨 Màu thiệp:',
        tags: ['🎉 Chúc mừng', '☕ Tâm sự', '💌 Tỏ tình', '👭 Bạn bè']
      },
      'zh-TW': {
        title: 'Q版可愛留言板', subtitle: '留下你溫馨可愛的留言吧！',
        labelName: '🐱 你的暱稱：', placeholderName: '請輸入超萌暱稱...',
        labelMsg: '💌 留言內容：', placeholderMsg: '寫點可愛的話吧...',
        submitBtn: '立即送出 🚀', submitting: '⏳ 傳送中...',
        sectionTitle: '✨ 歷史留言區 ✨', loading: '留言載入中... 🐾',
        empty: '目前還沒有留言！ 🐣', error: '❌ 讀取失敗！', refresh: '重新整理',
        search: '🔍 搜尋留言...', labelTag: '🏷️ 留言類別：', labelTheme: '🎨 卡片顏色：',
        tags: ['🎉 祝福', '☕ 心聲', '💌 告白', '👭 好友']
      },
      'zh-CN': {
        title: 'Q版可爱留言板', subtitle: '留下你温馨可爱的留言吧！',
        labelName: '🐱 你的昵称：', placeholderName: '请输入萌萌的昵称...',
        labelMsg: '💌 留言内容：', placeholderMsg: '写点可爱的话吧...',
        submitBtn: '立即发送 🚀', submitting: '⏳ 发送中...',
        sectionTitle: '✨ 历史留言区 ✨', loading: '留言加载中... 🐾',
        empty: '目前还没有留言！ 🐣', error: '❌ 读取失败！', refresh: '刷新',
        search: '🔍 搜索留言...', labelTag: '🏷️ 留言类别：', labelTheme: '🎨 卡片颜色：',
        tags: ['🎉 祝福', '☕ 心声', '💌 告白', '👭 好友']
      },
      'ja': {
        title: 'ちび一言掲示板', subtitle: 'メッセージを残していってね！',
        labelName: '🐱 お名前：', placeholderName: '名前を入力...',
        labelMsg: '💌 メッセージ：', placeholderMsg: '書いてね...',
        submitBtn: '送信する 🚀', submitting: '⏳ 送信中...',
        sectionTitle: '✨ メッセージ一覧 ✨', loading: '読み込み中... 🐾',
        empty: 'まだメッセージがありません！ 🐣', error: '❌ エラーが発生しました！', refresh: '更新',
        search: '🔍 メッセージを検索...', labelTag: '🏷️ カテゴリー：', labelTheme: '🎨 カードの色：',
        tags: ['🎉 お祝い', '☕ 雑談', '💌 告白', '👭 友達']
      },
      'en': {
        title: 'Chibi Guestbook', subtitle: 'Leave a sweet & cute message here!',
        labelName: '🐱 Your Name:', placeholderName: 'Enter nickname...',
        labelMsg: '💌 Message:', placeholderMsg: 'Write something cute...',
        submitBtn: 'Send Message 🚀', submitting: '⏳ Sending...',
        sectionTitle: '✨ Message Board ✨', loading: 'Loading... 🐾',
        empty: 'No messages yet! 🐣', error: '❌ Error loading!', refresh: 'Refresh',
        search: '🔍 Search messages...', labelTag: '🏷️ Category:', labelTheme: '🎨 Card Theme:',
        tags: ['🎉 Wishes', '☕ Talk', '💌 Love', '👭 Friends']
      }
    };

    let currentLang = 'vi';

    function changeLanguage(lang) {
      currentLang = lang;
      const t = i18n[lang] || i18n['vi'];
      document.getElementById('ui-title').innerText = t.title;
      document.getElementById('ui-subtitle').innerText = t.subtitle;
      document.getElementById('ui-label-name').innerText = t.labelName;
      document.getElementById('name').placeholder = t.placeholderName;
      document.getElementById('ui-label-msg').innerText = t.labelMsg;
      document.getElementById('message').placeholder = t.placeholderMsg;
      document.getElementById('submitBtn').innerText = t.submitBtn;
      document.getElementById('ui-section-title').innerText = t.sectionTitle;
      document.getElementById('ui-refresh').innerText = t.refresh;
      document.getElementById('searchInput').placeholder = t.search;
      document.getElementById('ui-label-tag').innerText = t.labelTag;
      document.getElementById('ui-label-theme').innerText = t.labelTheme;
      
      // Đổi ngôn ngữ cho các Option trong thẻ Tag
      for(let i = 0; i < 4; i++) {
        const opt = document.getElementById(`opt-tag-${i+1}`);
        if(opt) {
          opt.value = t.tags[i];
          opt.innerText = t.tags[i];
        }
      }

      filterMessages();
    }

    function addEmoji(emoji) {
      document.getElementById('message').value += emoji;
    }

    function selectTheme(themeClass, el) {
      selectedTheme = themeClass;
      document.querySelectorAll('.theme-opt').forEach(opt => opt.classList.remove('active'));
      el.classList.add('active');
    }

    function getAvatar(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash += name.charCodeAt(i);
      return avatars[hash % avatars.length];
    }

    // Tải danh sách - Tự giữ lại kết quả tìm kiếm nếu đang tìm
    async function loadMessages() {
      const listDiv = document.getElementById("list");
      const t = i18n[currentLang] || i18n['vi'];
      
      // Nếu không có tìm kiếm thì mới hiện trạng thái loading
      if (!document.getElementById('searchInput').value.trim()) {
        listDiv.innerHTML = `<div class="status-msg">${t.loading}</div>`;
      }

      try {
        const res = await fetch(GAS_URL);
        const data = await res.json();
        allMessages = data || [];
        filterMessages(); // Giữ nguyên bộ lọc sau khi làm mới
      } catch (e) {
        listDiv.innerHTML = `<div class="status-msg" style="color: #e03131;">${t.error}</div>`;
      }
    }

    function renderMessages(data) {
      const listDiv = document.getElementById("list");
      const t = i18n[currentLang] || i18n['vi'];

      if (!data || !data.length) {
        listDiv.innerHTML = `<div class="status-msg">${t.empty}</div>`;
        return;
      }

      listDiv.innerHTML = data.map((item, idx) => {
        const theme = item.theme || 'theme-yellow';
        const tag = item.tag ? `<span class="msg-badge">${escapeHtml(item.tag)}</span>` : '';
        const likes = likesData[idx] || 0;

        return `
          <div class="msg-card ${theme}">
            <div class="msg-header">
              <span class="msg-author">${getAvatar(item.name)} ${escapeHtml(item.name)}</span>
              <span class="msg-time">${item.time || ''}</span>
            </div>
            ${tag}
            <div class="msg-content">${escapeHtml(item.message)}</div>
            <div class="msg-footer">
              <button class="like-btn" onclick="addLike(${idx})">❤️ ${likes}</button>
            </div>
          </div>
        `;
      }).join('');
    }

    // Lọc tin nhắn từ danh sách gốc
    function filterMessages() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!q) {
        renderMessages(allMessages);
        return;
      }
      const filtered = allMessages.filter(m => 
        (m.name && m.name.toLowerCase().includes(q)) || 
        (m.message && m.message.toLowerCase().includes(q)) ||
        (m.tag && m.tag.toLowerCase().includes(q))
      );
      renderMessages(filtered);
    }

    function addLike(idx) {
      likesData[idx] = (likesData[idx] || 0) + 1;
      filterMessages();
    }

    document.getElementById("msgForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      const name = document.getElementById("name").value.trim();
      const message = document.getElementById("message").value.trim();
      const tag = document.getElementById("tag").value;
      const t = i18n[currentLang] || i18n['vi'];

      if(!name || !message) return;

      btn.disabled = true;
      btn.innerText = t.submitting;

      try {
        await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ name, message, tag, theme: selectedTheme })
        });

        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });

        document.getElementById("name").value = "";
        document.getElementById("message").value = "";
        loadMessages();
      } catch (e) {
        alert("Thất bại!");
      } finally {
        btn.disabled = false;
        btn.innerText = t.submitBtn;
      }
    });

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
    }

    loadMessages();
  </script>
</body>
</html>
